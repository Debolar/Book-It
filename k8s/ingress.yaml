apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookit
  namespace: bookit
spec:
  ingressClassName: traefik
  rules:
    - host: bookit.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8000