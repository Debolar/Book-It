apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Debolar/Book-It.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: bookit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true